# Deploy the static 小小中文 page so phones can open it without running Go.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/import-xiaoxue-zhongwen-a877]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
